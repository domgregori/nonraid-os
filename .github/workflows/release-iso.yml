name: Build and release NonRAID OS ISO

# Runs build/build-image.sh (which downloads and GPG-verifies its own
# Debian netinst ISO, vendors nonraid/nonraid-webui and the mergerfs/rclone
# debs, and remasters the ISO - see that script's own comments) and
# publishes the result as a GitHub Release asset. No VM boot-testing here -
# that still needs a real machine, see PLAN.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (e.g. v1.0.0) - only used on a manual run; ignored on a tag push"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick cpio git curl gnupg build-essential zlib1g-dev libbz2-dev libacl1-dev

      # Not installed via apt: Ubuntu's packaged xorriso (1.5.6 on ubuntu-latest as of this
      # writing) has a real bug remastering Debian's current hybrid BIOS+UEFI+GPT+APM netinst
      # ISOs - confirmed live, a real run here failed with "Cannot enable EL Torito boot image #1"
      # / "Cannot refer by isohybrid MBR to data outside of ISO 9660 filesystem" from build-
      # image.sh's final `-boot_image any replay` step, while the exact same source ISO builds
      # clean with a newer xorriso (1.5.8.pl02, replays all 22 boot-related commands here vs.
      # only 18 on 1.5.6). Built from source instead, pinned to that known-good version -
      # --disable-libreadline since this is a non-interactive CI run with no need for xorriso's
      # interactive-shell mode.
      - name: Build and install xorriso 1.5.8.pl02 from source
        run: |
          curl -fsSL -o /tmp/xorriso.tar.gz https://www.gnu.org/software/xorriso/xorriso-1.5.8.pl02.tar.gz
          tar -xzf /tmp/xorriso.tar.gz -C /tmp
          cd /tmp/xorriso-1.5.8
          ./configure --disable-libreadline
          make -j"$(nproc)"
          sudo make install

      - name: Build nonraid-os.iso
        run: ./build/build-image.sh

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "No tag: push a 'v*' tag, or provide one via workflow_dispatch's 'tag' input." >&2
            exit 1
          fi

      - name: Rename ISO for the release asset
        run: mv nonraid-os.iso "nonraid-os-${{ steps.tag.outputs.tag }}.iso"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" "nonraid-os-$TAG.iso" --title "$TAG" --generate-notes \
            || gh release upload "$TAG" "nonraid-os-$TAG.iso" --clobber
